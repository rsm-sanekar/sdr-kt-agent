[project]
name = "milestone04"
version = "0.1.0"
description = "Milestone 04 — GenAI for Business (SDR onboarding AI coworker)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "ipykernel>=6.29",
    "ipython>=8.0",
    "requests>=2.32",
    "pyarrow>=17",
    "mcp>=1.27.1",
    "rank-bm25>=0.2.2",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "chromadb>=0.5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[dependency-groups]
dev = [
    "deepeval>=4.0.3",
    "pytest>=8.0",
    "ruff>=0.5",
]
# Local audio transcription for Coaching Notes. mlx-whisper is Apple-Silicon
# only, so it lives in an opt-in group (install with `uv sync --group audio`)
# and is imported lazily — non-Mac environments and CI stay unaffected.
audio = [
    "mlx-whisper>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that make real network calls to the TritonAI API (skipped by default)",
    "deepeval: DeepEval quality suite — hits real LLM, slow, skipped by default (opt-in with `-m deepeval`)",
]
addopts = "-m 'not integration and not deepeval'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Seed script for the certification cohort holds long content strings
# (transcripts, exam Q&A, evidence quotes) verbatim — line-length policing
# would force unreadable line breaks inside human-readable prose.
"skills/score-certification/scripts/seed_synthetic_cohort.py" = ["E501"]
